
services:
  db:
    image: postgis/postgis:16-master
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
    - "8000:8000"

    
    depends_on:
      - db
    env_file:
      - ".env"

